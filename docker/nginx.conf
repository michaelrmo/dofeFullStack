worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_max_body_size 30m;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Azure terminates HTTPS before forwarding HTTP to this container.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    server {
        listen 8080;
        server_name _;
        root /app/client/build;
        index index.html;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        location = /healthz {
            proxy_pass http://127.0.0.1:3001;
        }

        location /auth/ {
            proxy_pass http://127.0.0.1:3001;
        }

        location /users/ {
            proxy_pass http://127.0.0.1:3001;
        }

        location /assets/ {
            proxy_pass http://127.0.0.1:3001;
        }

        # Preserve the raw request body for Stripe signature verification.
        location /stripe/ {
            proxy_pass http://127.0.0.1:4242;
        }

        location /static/ {
            try_files $uri =404;
            expires 1y;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # React Router routes must also work when refreshed directly.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
